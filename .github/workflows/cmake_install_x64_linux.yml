name: "CMake Install (x64 Linux)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' }}

# This gives read-only access to the token.
permissions: read-all

jobs:
  install-x64-linux-cmake:
    name: install-x64-linux-cmake (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            shared: "OFF"
          - name: shared
            shared: "ON"
    env:
      BUILD_SHARED_LIBS: ${{ matrix.shared }}
      CACHE_NAME: install-x64-linux-cmake-${{ matrix.name }}
      USE_CCACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Build Paths
        run: |
          set -euo pipefail
          {
            echo "ABSL_PREFIX=${RUNNER_TEMP}/absl-install"
            echo "BUILD_DIR=${RUNNER_TEMP}/openfst-build"
            echo "OPENFST_PREFIX=${RUNNER_TEMP}/openfst-install"
          } >> "$GITHUB_ENV"

      - name: Read Pinned Abseil Metadata
        id: absl-meta
        run: |
          set -euo pipefail
          sha256="$(./scripts/install_pinned_abseil.sh --print-sha256)"
          cxx_version="$("${CXX:-c++}" -dumpfullversion -dumpversion)"
          {
            echo "sha256=${sha256}"
            echo "image_os=${ImageOS:-unknown}"
            echo "cxx_version=${cxx_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Pinned Abseil
        id: absl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ABSL_PREFIX }}
          key: absl-${{ runner.os }}-${{ runner.arch }}-${{ steps.absl-meta.outputs.image_os }}-${{ steps.absl-meta.outputs.cxx_version }}-${{ env.BUILD_SHARED_LIBS }}-${{ steps.absl-meta.outputs.sha256 }}-${{ hashFiles('scripts/install_pinned_abseil.sh') }}

      - name: Install Pinned Abseil
        if: steps.absl-cache.outputs.cache-hit != 'true'
        run: ./scripts/install_pinned_abseil.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: cmake-cache-${{ env.CACHE_NAME }}

      - name: Build, Test, Install, and Verify OpenFst
        run: ./scripts/test_cmake_install.sh

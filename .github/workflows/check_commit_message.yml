name: "Check Commit Message"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{github.workflow }}-${{github.head_ref || github.ref}}
  cancel-in-progress: ${{github.ref != 'main'}}

permissions: read-all

jobs:
    check-commit-message:
      runs-on: ubuntu-latest
      timeout-minutes: 1
      steps:
        - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
          with:
            persist-credentials: false
        - name: Check for internal-only commit messages
          run: |
            # Fail if the head commit message looks like an internal-only change
            # that should not have been exported via Copybara.
            #
            # NOTE: This only checks the head commit (git log -1). If a push
            # contains multiple commits, only the last one is validated. This is
            # fine as long as Copybara squashes into single commits per push.
            #
            # NOTE: This does substring matching, so a message merely mentioning
            # "internal change" would also match. We can tighten the pattern if
            # this becomes a problem in practice.
            if git log -1 --format=%B | grep -iqE 'internal change|automated code change'; then
              echo "::error::Commit message contains a forbidden phrase ('internal change' or 'automated code change')."
              echo "This commit should not have been exported."
              exit 1
            fi
